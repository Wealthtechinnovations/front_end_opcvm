name: GOV-006 SUIVI checkpoint

on:
  push:
    branches:
      - claude/code-review-improvements-ikvuj
    paths:
      - '.github/workflows/governance-suivi-gov006.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gov-006-suivi-checkpoint
  cancel-in-progress: false

jobs:
  checkpoint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/code-review-improvements-ikvuj
          fetch-depth: 0

      - name: Update canonical SUIVI
        run: |
          set -euo pipefail
          python scripts/governance/update_suivi_gov006.py
          git diff --check
          git diff -- SUIVI.md

      - name: Commit with concurrency guard
        run: |
          set -euo pipefail
          BRANCH='claude/code-review-improvements-ikvuj'
          git config user.name 'FundAfrica Governance Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add SUIVI.md
          if git diff --cached --quiet; then
            echo 'SUIVI already up to date.'
            exit 0
          fi
          git fetch origin "$BRANCH"
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/$BRANCH)"
          git commit -m 'docs(suivi): record GOV-006 reconciliation checkpoint'
          git push origin "HEAD:$BRANCH"
