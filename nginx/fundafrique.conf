# Redirect HTTP to HTTPS
server {
    listen 80;
    server_name fundafrique.com www.fundafrique.com api.fundafrique.com;
    return 301 https://$host$request_uri;
}

# Frontend - fundafrique.com
server {
    listen 443 ssl http2;
    server_name fundafrique.com www.fundafrique.com;

    # SSL certificates (managed by Certbot)
    # ssl_certificate /etc/letsencrypt/live/fundafrique.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/fundafrique.com/privkey.pem;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # Static assets caching
    location /_next/static {
        proxy_pass http://127.0.0.1:3000;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location /images {
        proxy_pass http://127.0.0.1:3000;
        add_header Cache-Control "public, max-age=86400";
    }

    # Main proxy to Next.js
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # Max upload size
    client_max_body_size 10M;
}

# API - api.fundafrique.com
server {
    listen 443 ssl http2;
    server_name api.fundafrique.com;

    # SSL certificates (managed by Certbot)
    # ssl_certificate /etc/letsencrypt/live/api.fundafrique.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/api.fundafrique.com/privkey.pem;

    # Security headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;

    # Gzip
    gzip on;
    gzip_types application/json;

    # API proxy
    location / {
        proxy_pass http://127.0.0.1:3005;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # File uploads
    location /uploads {
        proxy_pass http://127.0.0.1:3005/uploads;
        add_header Cache-Control "public, max-age=86400";
    }

    # Max upload size
    client_max_body_size 50M;
}
