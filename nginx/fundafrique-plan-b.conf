# ============================================
# Fundafrique - Plan B: 2-subdomain architecture
# Frontend: africafunds.chainsolutions.fr -> 127.0.0.1:3000
# API:      api-africafunds.chainsolutions.fr -> 127.0.0.1:3005
# ============================================

# Redirect HTTP to HTTPS for both domains
server {
    listen 80;
    server_name africafunds.chainsolutions.fr api-africafunds.chainsolutions.fr;
    return 301 https://$host$request_uri;
}

# ---- Frontend: africafunds.chainsolutions.fr ----
server {
    listen 443 ssl http2;
    server_name africafunds.chainsolutions.fr;

    # SSL certificates (managed by Certbot)
    # ssl_certificate /etc/letsencrypt/live/africafunds.chainsolutions.fr/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/africafunds.chainsolutions.fr/privkey.pem;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # Max upload size for frontend
    client_max_body_size 10M;

    # Next.js static assets (long cache)
    location /_next/static {
        proxy_pass http://127.0.0.1:3000;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Static images
    location /images {
        proxy_pass http://127.0.0.1:3000;
        add_header Cache-Control "public, max-age=86400";
    }

    # Everything else -> Next.js
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}

# ---- API: api-africafunds.chainsolutions.fr ----
server {
    listen 443 ssl http2;
    server_name api-africafunds.chainsolutions.fr;

    # SSL certificates (managed by Certbot)
    # ssl_certificate /etc/letsencrypt/live/api-africafunds.chainsolutions.fr/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/api-africafunds.chainsolutions.fr/privkey.pem;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # Max upload size for API
    client_max_body_size 50M;

    # File uploads with cache headers
    location /uploads/ {
        proxy_pass http://127.0.0.1:3005/uploads/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "public, max-age=86400";
    }

    # All API requests
    location / {
        proxy_pass http://127.0.0.1:3005;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
